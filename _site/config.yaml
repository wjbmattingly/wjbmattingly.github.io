about:
  image: "./assets/about-me.png"
  text: I develop ethical AI systems for historical archives. My primary area of research is applied machine learning to archival records. I focus on the application of natural language processing methods on multilingual archives. At the Bitter Aloe Project, I am developing methods for knowledge extraction from documents produced by the South African Truth and Reconciliation Commission (TRC). At the United States Holocaust Memorial Museum, I am exploring how we can develop semantic search to allow researchers to discover documents more effectively. At the Smithsonian, I developing methods for identifying women in records.
  details:
    - title: "Experience"
      icon: "./assets/experience.png"
      description: "5+ years<br>Natural Language Processing Engineer and Project Leader"
    - title: "Education"
      icon: "./assets/education.png"
      description: "PhD in History<br>M.A. in History<br>B.A. in History"


